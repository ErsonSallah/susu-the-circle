<script>
(()=>{'use strict';
const KEY='susu.circle.v1', VERSION=1, MAX_MEMBERS=30;
const icons={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>',moon:'<path d="M20.985 12.486A9 9 0 0 1 11.514 3.015 9 9 0 1 0 20.985 12.486Z"/>',home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/>',rotation:'<path d="M7 7h14l-3-3m3 3-3 3M17 17H3l3-3m-3 3 3 3"/>',history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5m4-1v5l4 2"/>',setup:'<path d="M4 7h16M4 17h16M8 4v6m8 4v6"/>',up:'<path d="m6 15 6-6 6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',trash:'<path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/>',check:'<path d="m5 12 4 4L19 6"/>',download:'<path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v4h16v-4"/>',upload:'<path d="M12 21V9m0 0 4 4m-4-4-4 4M4 7V3h16v4"/>',lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>'};
const svg=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||''}</svg>`;
const el=(id)=>document.getElementById(id);const esc=(x)=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,10)}`;
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
const now=()=>new Date().toISOString();
function validDay(day){if(!/^\d{4}-\d\d-\d\d$/.test(day||''))return false;const d=new Date(day+'T12:00:00Z');return !isNaN(+d)&&d.toISOString().slice(0,10)===day;}
function plusPeriods(day,index,frequency){const [y,m,d]=day.split('-').map(Number);if(frequency==='monthly'){const first=new Date(Date.UTC(y,m-1+index,1));const last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();return `${first.getUTCFullYear()}-${String(first.getUTCMonth()+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`;}
 const step=frequency==='biweekly'?14:7;return new Date(Date.UTC(y,m-1,d+step*index)).toISOString().slice(0,10);}
function formatDay(day){if(!validDay(day))return day;const[y,m,d]=day.split('-').map(Number);return new Intl.DateTimeFormat('en-US',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,d)));}
function stamp(iso){try{return new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}catch{return iso}}
const minorFactor=c=>(c==='XOF'||c==='XAF')?1:100;
function money(minor,currency){const digits=minorFactor(currency)===1?0:2;const number=new Intl.NumberFormat('en-US',{minimumFractionDigits:digits,maximumFractionDigits:digits}).format(minor/minorFactor(currency));const symbol={USD:'$',EUR:'€',GHS:'GH₵',XOF:'CFA ',XAF:'CFA '}[currency]||((currency||'USD')+' ');return symbol+number;}
function parseAmount(s,c){if(typeof s!=='string'||!/^(\d+)(\.\d{1,2})?$/.test(s.trim()))return null;const value=Number(s);const mult=minorFactor(c);if((mult===1&&s.includes('.'))||!Number.isFinite(value)||value<=0||value*mult>1e12)return null;return Math.round(value*mult)}
function initial(){const members=['Person A','Person B','Person C','Person D','Person E'].map(name=>({id:uid(),name}));return {version:VERSION,theme:'light',currency:'USD',contributionMinor:2000,frequency:'weekly',startDate:today(),members,cycle:{id:uid(),createdAt:now(),rounds:members.map(()=>({payments:{},payout:null}))},archives:[],events:[]};}
let state,tab='home',historyView='all',storageOK=true,toastTimeout;
function validState(s){return !!s&&s.version===VERSION&&['USD','EUR','GHS','XOF','XAF'].includes(s.currency)&&['weekly','biweekly','monthly'].includes(s.frequency)&&validDay(s.startDate)&&Number.isSafeInteger(s.contributionMinor)&&s.contributionMinor>0&&Array.isArray(s.members)&&s.members.length>=2&&s.members.length<=MAX_MEMBERS&&s.members.every(m=>typeof m.id==='string'&&typeof m.name==='string'&&m.name.trim().length>0&&m.name.length<=48)&&new Set(s.members.map(m=>m.id)).size===s.members.length&&s.cycle&&typeof s.cycle.id==='string'&&Array.isArray(s.cycle.rounds)&&s.cycle.rounds.length===s.members.length&&s.cycle.rounds.every(r=>r&&r.payments&&typeof r.payments==='object'&&(!r.payout||typeof r.payout==='object'))&&Array.isArray(s.archives)&&Array.isArray(s.events);}
function read(){try{const x=localStorage.getItem(KEY);if(x){const s=JSON.parse(x);if(validState(s))return s;}localStorage.setItem('__susu_test','1');localStorage.removeItem('__susu_test');return initial();}catch(e){storageOK=false;return initial()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}render();}
function popup(message){const host=el('toast-holder');if(!host)return;host.innerHTML=`<div class="toast" role="status">${esc(message)}</div>`;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>host.innerHTML='',2600)}
function cycleIndex(){return state.cycle.rounds.findIndex(r=>!r.payout)}
function allPaid(round){return state.members.every(m=>!!round.payments[m.id]);}
function currentRound(){const i=cycleIndex();return i>=0?state.cycle.rounds[i]:null;}
function settingsOf(s){return {members:s.members,currency:s.currency,contributionMinor:s.contributionMinor,frequency:s.frequency,startDate:s.startDate};}
function archiveCurrent(reason){const snapshot={id:state.cycle.id,createdAt:state.cycle.createdAt,closedAt:now(),reason,...JSON.parse(JSON.stringify(settingsOf(state))),rounds:JSON.parse(JSON.stringify(state.cycle.rounds))};
 if(state.events.some(e=>e.cycleId===state.cycle.id)||state.cycle.rounds.some(r=>r.payout)||state.cycle.rounds.some(r=>Object.keys(r.payments).length))state.archives.unshift(snapshot);
}
function makeCycle(){state.cycle={id:uid(),createdAt:now(),rounds:state.members.map(()=>({payments:{},payout:null}))};}
function startFresh(reason){archiveCurrent(reason);makeCycle();}
function nextCycle(){if(cycleIndex()!==-1)return popup('Finish this rotation first.');if(!confirm('Begin a new cycle with the same people and order? The finished cycle remains in History.'))return;const last=plusPeriods(state.startDate,state.members.length-1,state.frequency);state.startDate=plusPeriods(last,1,state.frequency);startFresh('Completed cycle');save();tab='home';render();popup('New cycle started.');}
function nav(){const names=['home','rotation','history','setup'];el('nav').innerHTML=names.map(n=>`<button type="button" class="navitem ${n===tab?'active':''}" data-tab="${n}" aria-current="${n===tab?'page':'false'}">${svg(n)}<span>${n[0].toUpperCase()+n.slice(1)}</span></button>`).join('');el('theme-btn').innerHTML=svg(state.theme==='dark'?'sun':'moon');el('theme-btn').title=state.theme==='dark'?'Switch to light greens':'Switch to dark greens';document.documentElement.dataset.theme=state.theme==='dark'?'dark':'light';document.querySelector('meta[name="theme-color"]').content=state.theme==='dark'?'#07130e':'#f4f8f4';}
function title(section,kicker,subtitle,extra=''){return `<div class="headrow"><div><div class="eyebrow">${kicker}</div><h1 class="pagetitle">${section}</h1>${subtitle?`<p class="pagesub">${subtitle}</p>`:''}</div>${extra}</div>`;}
function formatDue(i){return formatDay(plusPeriods(state.startDate,i,state.frequency))}
function home(){const i=cycleIndex();if(i<0){return `${title('Circle complete','ALL PAID OUT','Everyone has received their turn. Your cycle is ready to renew.')}<div class="hero"><div class="eyebrow">Rotation finished</div><div class="pot">${esc(money(state.contributionMinor*state.members.length,state.currency))}</div><div class="herofoot"><div><label>Paid out</label><b>${state.members.length} of ${state.members.length} rounds</b></div><span class="roundchip">100% complete</span></div></div><section class="panel"><div class="notice">All payouts were recorded. A new cycle keeps the same order and schedules the next payout after the last one.</div><button class="button primary wide" type="button" data-action="new-cycle">Start next cycle →</button></section>`}
 const round=state.cycle.rounds[i],collector=state.members[i],paid=state.members.filter(m=>round.payments[m.id]).length,pot=state.members.length*state.contributionMinor,received=paid*state.contributionMinor,ready=paid===state.members.length;const day=plusPeriods(state.startDate,i,state.frequency),overdue=day<today();return `${title('Home','YOUR CIRCLE','One banker. One rotation. Everyone gets a turn.',`<span class="datechip">${esc(formatDay(today()))}</span>`)}${!storageOK?'<div class="notice danger"><strong>Auto-save unavailable in this browser.</strong> Export a JSON backup before closing, or your changes may be lost.</div>':''}<section class="hero"><div class="eyebrow">This round’s full pot</div><div class="pot">${esc(money(pot,state.currency))}</div><div class="herofoot"><div><label>Collecting this round</label><b>${esc(collector.name)}</b><div style="font-size:11px;color:#c5e5cc;margin-top:5px">${esc(formatDay(day))}</div></div><span class="roundchip">ROUND ${i+1} / ${state.members.length}</span></div></section><div class="statgrid"><div class="stat"><small>Received</small><strong>${esc(money(received,state.currency))}</strong><span>${paid} / ${state.members.length} people</span></div><div class="stat"><small>Remaining</small><strong>${esc(money(pot-received,state.currency))}</strong><span>to complete pot</span></div><div class="stat"><small>Due</small><strong>${day.slice(8)}/${day.slice(5,7)}</strong><span>${overdue?'Past due':day===today()?'Today':'Scheduled'}</span></div></div><section class="panel"><div class="sectionhead"><h2>Contribution checklist</h2><span class="mini">${paid} of ${state.members.length} confirmed</span></div><div class="progress"><i style="width:${100*paid/state.members.length}%"></i></div><p class="tip">Tick only after the funds have actually arrived. The recipient also contributes to their own round.</p>${state.members.map(m=>`<div class="person"><div class="avatar">${esc(initials(m.name))}</div><div class="persondata"><div class="personname">${esc(m.name)} ${m.id===collector.id?'<span class="tag now">Collecting</span>':''}</div><div class="personmeta">${esc(money(state.contributionMinor,state.currency))} due${round.payments[m.id]?' · Confirmed '+esc(stamp(round.payments[m.id].at)):''}</div></div><button type="button" data-action="pay" data-id="${esc(m.id)}" class="paidbtn ${round.payments[m.id]?'paid':''}" aria-pressed="${!!round.payments[m.id]}">${round.payments[m.id]?`${svg('check')} Paid`:'Mark paid'}</button></div>`).join('')}<div class="divider"></div><button class="button primary wide" type="button" data-action="payout" ${ready?'':'disabled'}>${ready?'Confirm payout to '+esc(collector.name):'Confirm all contributions first'}</button>${overdue?'<div class="notice warn">Scheduled payout date has passed. The round does not advance until the banker records the payout.</div>':''}<p class="tip" style="text-align:center;margin-bottom:0">Manual ledger only · No transfers are made inside SUSU.</p></section><section class="panel"><div class="sectionhead"><h2>Up next</h2><button type="button" class="button secondary small" data-tab="rotation">Full rotation →</button></div>${i+1<state.members.length?`<div class="person"><div class="avatar">${esc(initials(state.members[i+1].name))}</div><div class="persondata"><div class="personname">${esc(state.members[i+1].name)}</div><div class="personmeta">${esc(formatDue(i+1))}</div></div><span class="tag">Round ${i+2}</span></div>`:'<p class="tip">This is the final collector in the current cycle.</p>'}</section>`}
function initials(name){return name.trim().split(/\s+/).slice(0,2).map(s=>s[0]||'').join('').toUpperCase()}
function rotation(){const i=cycleIndex();const next=i===-1?'Cycle complete':`${state.members[i].name} is collecting`;return `${title('Rotation','THE PAYOUT ORDER',`${state.frequency==='biweekly'?'Every two weeks':state.frequency==='monthly'?'Monthly':'Weekly'} · ${state.members.length} members · ${esc(money(state.contributionMinor,state.currency))} each`)}<section class="panel"><div class="sectionhead"><h2>Collection schedule</h2><span class="tag ${i>=0?'now':'done'}">${esc(next)}</span></div><p class="tip">Dates are planned. A round stays open until the banker confirms its payout, even if its date has passed.</p>${state.members.map((m,j)=>{const r=state.cycle.rounds[j],count=state.members.filter(x=>r.payments[x.id]).length;const status=r.payout?'Paid out':j===i?'Current':j>i?'Upcoming':'Pending';return `<div class="rotationrow"><div class="stepno ${j===i?'now':''}">${j+1}</div><div class="rotationcontent"><strong>${esc(m.name)}</strong><span>${esc(formatDue(j))} · ${esc(money(state.members.length*state.contributionMinor,state.currency))}</span><span>${count}/${state.members.length} contributions confirmed</span></div><span class="tag ${r.payout?'done':j===i?'now':''}">${esc(status)}</span></div>`}).join('')}</section><section class="panel"><div class="sectionhead"><h2>How rotation works</h2></div><div class="tip">Everyone contributes the fixed amount each round. One person receives the entire pot. After all ${state.members.length} payouts, the rotation can restart in the same order. Editing the order in Setup starts a fresh cycle; the previous ledger is retained in History.</div></section>`}
function history(){const options=[['all','All cycles'],['current','Current cycle'],['archived','Archived only']];let evs=[...state.events].filter(e=>historyView==='all'||(historyView==='current'?e.cycleId===state.cycle.id:e.cycleId!==state.cycle.id)).reverse();return `${title('History','THE LEDGER','A record of payment confirmations, reversals, and payouts.')}<section class="panel"><div class="sectionhead"><h2>Event ledger</h2><select aria-label="Filter history" class="selectsmall" id="history-filter">${options.map(([key,lab])=>`<option value="${key}" ${historyView===key?'selected':''}>${lab}</option>`).join('')}</select></div>${evs.length?evs.map(e=>{const icon=e.type==='payout'?'↗':e.type==='payment_reversed'?'↶':'✓';const lab=e.type==='payout'?'Payout completed':e.type==='payment_reversed'?'Contribution reversed':'Contribution confirmed';return `<div class="historyrow"><div class="eventicon ${e.type==='payment_reversed'?'reversed':''}">${icon}</div><div class="eventdetails"><strong>${lab}</strong><small>${esc(e.memberName)} · Round ${e.roundIndex+1}<br>${esc(stamp(e.at))}${e.cycleId!==state.cycle.id?' · Older cycle':''}</small></div><div class="eventamount">${e.type==='payment_reversed'?'-':''}${esc(money(e.amountMinor,e.currency))}</div></div>`}).join(''):'<div class="empty"><div class="glyph">◷</div>No activity recorded yet.<br>Check off a contribution on Home to begin.</div>'}</section><section class="panel"><div class="sectionhead"><h2>Cycle archives</h2><span class="mini">${state.archives.length} saved</span></div>${state.archives.length?state.archives.map((a,j)=>`<div class="rotationrow"><div class="stepno">${j+1}</div><div class="rotationcontent"><strong>${esc(a.reason||'Previous cycle')}</strong><span>${esc(stamp(a.closedAt))} · ${a.members.length} people · ${esc(a.frequency)}</span><span>${a.rounds.filter(r=>r.payout).length}/${a.rounds.length} payouts completed · ${esc(a.currency)}</span></div><span class="tag done">Archived</span></div>`).join(''):'<div class="empty">Completed or reset cycles appear here automatically.</div>'}</section><section class="panel"><div class="sectionhead"><h2>Export & restore</h2></div><p class="tip">JSON saves the whole circle and can be imported later. CSV is a spreadsheet-friendly ledger. The Markdown snapshot creates updated Obsidian notes.</p><div class="buttonrow"><button type="button" class="button primary" data-action="json-export">${svg('download')} JSON backup</button><button type="button" class="button ghost" data-action="csv-export">${svg('download')} CSV ledger</button><button type="button" class="button secondary" data-action="md-export">${svg('download')} Markdown snapshot</button></div><div class="divider"></div><div class="buttonrow"><button class="button ghost" type="button" data-action="json-import">${svg('upload')} Restore JSON backup</button><button class="button danger" type="button" data-action="manual-archive">Archive / reset</button></div><div class="notice warn"><strong>Important:</strong> Data is stored in this browser, not written into Obsidian notes automatically. Export a JSON backup whenever money changes hands, and before switching devices or browsers.</div></section>`}
function setup(){return `${title('Setup','THE BANKER DESK','Configure your circle. You control the collection order.')}<section class="panel"><div class="sectionhead"><h2>Contribution rules</h2><span class="tag">${state.members.length} members</span></div><form id="settings-form"><div class="fieldgrid"><div class="field"><label for="currency">Currency</label><select name="currency" id="currency"><option value="USD" ${state.currency==='USD'?'selected':''}>USD · US Dollar</option><option value="EUR" ${state.currency==='EUR'?'selected':''}>EUR · Euro</option><option value="GHS" ${state.currency==='GHS'?'selected':''}>GHS · Ghana Cedi</option><option value="XOF" ${state.currency==='XOF'?'selected':''}>CFA · XOF (West Africa)</option><option value="XAF" ${state.currency==='XAF'?'selected':''}>CFA · XAF (Central Africa)</option></select></div><div class="field"><label for="amount">Amount per person / round</label><input name="amount" id="amount" inputmode="decimal" required value="${state.contributionMinor/minorFactor(state.currency)}"></div><div class="field"><label for="frequency">Contribution frequency</label><select name="frequency" id="frequency"><option value="weekly" ${state.frequency==='weekly'?'selected':''}>Weekly · every 7 days</option><option value="biweekly" ${state.frequency==='biweekly'?'selected':''}>Biweekly · every 14 days</option><option value="monthly" ${state.frequency==='monthly'?'selected':''}>Monthly · calendar months</option></select></div><div class="field"><label for="startDate">First payout date</label><input name="startDate" id="startDate" type="date" required value="${state.startDate}"></div></div><div class="divider"></div><div class="subheading">Members · top to bottom payout order</div><div id="member-list">${state.members.map((m,i)=>`<div class="memberedit"><span class="stepno">${i+1}</span><input required aria-label="Member ${i+1} name" maxlength="48" data-member-name="${esc(m.id)}" value="${esc(m.name)}"><div class="memberactions"><button type="button" class="iconbtn" data-action="up" data-id="${esc(m.id)}" aria-label="Move ${esc(m.name)} up" ${i===0?'disabled':''}>${svg('up')}</button><button type="button" class="iconbtn" data-action="down" data-id="${esc(m.id)}" aria-label="Move ${esc(m.name)} down" ${i===state.members.length-1?'disabled':''}>${svg('down')}</button><button type="button" class="iconbtn red" data-action="remove" data-id="${esc(m.id)}" aria-label="Remove ${esc(m.name)}" ${state.members.length<=2?'disabled':''}>${svg('trash')}</button></div></div>`).join('')}</div><div class="buttonrow"><button type="button" class="button secondary small" data-action="add" ${state.members.length>=MAX_MEMBERS?'disabled':''}>+ Add member</button><span class="mini" style="align-self:center">2–${MAX_MEMBERS} people</span></div><div class="divider"></div><button type="submit" class="button primary wide">Save configuration</button></form><div class="notice warn"><strong>Schedule safety:</strong> Changing the order, adding/removing a member, or changing the currency, amount, frequency or first payout date starts a new cycle. The previous ledger is archived. Renaming people alone keeps the current cycle.</div></section><section class="panel"><div class="sectionhead"><h2>Privacy & continuity</h2></div><p class="tip">Offline-first, no login, no server, and no bank connection. Only this browser stores your live edits. Exports are the portable backup. The banker should be the single source of truth for contributions.</p><div class="buttonrow"><button type="button" class="button ghost" data-action="json-export">${svg('download')} Download backup</button><button type="button" class="button secondary" data-tab="history">Go to history</button></div></section>`}
function render(){if(!state)return;nav();el('view').innerHTML=(tab==='home'?home():tab==='rotation'?rotation():tab==='history'?history():setup())+'<div class="footerline">SUSU V1 · No fees · No accounts · Your circle, your records.</div>'}
function event(type,member,i){state.events.push({id:uid(),cycleId:state.cycle.id,type,memberId:member.id,memberName:member.name,roundIndex:i,amountMinor:type==='payout'?state.members.length*state.contributionMinor:state.contributionMinor,currency:state.currency,at:now()})}
function onPayment(id){const i=cycleIndex();if(i<0)return;const member=state.members.find(m=>m.id===id);if(!member)return;const round=state.cycle.rounds[i];if(round.payments[id]){if(!confirm(`Reverse ${member.name}'s confirmed contribution for round ${i+1}? This will be logged.`))return;delete round.payments[id];event('payment_reversed',member,i);save();popup('Contribution reversed and logged.')}else{round.payments[id]={at:now()};event('payment_confirmed',member,i);save();popup(`${member.name}: contribution confirmed.`)}}
function onPayout(){const i=cycleIndex();if(i<0)return;const r=state.cycle.rounds[i],m=state.members[i];if(!allPaid(r))return popup('The pot is not fully confirmed.');const amount=state.members.length*state.contributionMinor;if(!confirm(`Confirm that ${m.name} received ${money(amount,state.currency)} for round ${i+1}? This moves to the next recipient.`))return;r.payout={at:now(),amountMinor:amount};event('payout',m,i);save();popup('Payout recorded. '+(cycleIndex()===-1?'Cycle complete!':'Next collector is ready.'))}
function changedMembersNames(fd){return state.members.map(m=>{const input=document.querySelector(`input[data-member-name="${CSS.escape(m.id)}"]`);return {id:m.id,name:input?input.value.trim():m.name}})}
function uniqueNames(ms){return ms.every(m=>m.name&&m.name.length<=48)&&new Set(ms.map(m=>m.name.toLocaleLowerCase())).size===ms.length}
function saveConfig(e){e.preventDefault();const form=el('settings-form'),currency=form.elements.currency.value,amount=parseAmount(form.elements.amount.value,currency),freq=form.elements.frequency.value,startDate=form.elements.startDate.value,names=changedMembersNames();if(!amount)return popup('Enter a valid positive contribution amount.');if(!validDay(startDate))return popup('Choose a valid first payout date.');if(!uniqueNames(names))return popup('Give everyone a unique nonempty name.');const changed=currency!==state.currency||amount!==state.contributionMinor||freq!==state.frequency||startDate!==state.startDate;if(changed&&!confirm('These changes start a fresh cycle. The current ledger will be archived. Continue?'))return;const old=JSON.parse(JSON.stringify(state));if(changed)archiveCurrent('Configuration updated');state.currency=currency;state.contributionMinor=amount;state.frequency=freq;state.startDate=startDate;state.members=names;if(changed)makeCycle();save();popup(changed?'New schedule saved; prior activity archived.':'Names saved.');}
function changeMembers(kind,id){const index=state.members.findIndex(m=>m.id===id);let proposed=state.members.map(m=>({...m})),description='';if(kind==='add'){if(proposed.length>=MAX_MEMBERS)return;let candidate='New member',count=1;while(proposed.some(m=>m.name.toLowerCase()===candidate.toLowerCase()))candidate=`New member ${++count}`;proposed.push({id:uid(),name:candidate});description=`Add ${candidate}`;}if(kind==='remove'){if(proposed.length<=2||index<0)return;description=`Remove ${proposed[index].name}`;proposed.splice(index,1);}if(kind==='up'||kind==='down'){const to=index+(kind==='up'?-1:1);if(index<0||to<0||to>=proposed.length)return;[proposed[index],proposed[to]]=[proposed[to],proposed[index]];description=`Change payout order for ${state.members[index].name}`;}
 if(!confirm(`${description}? This will start a new cycle and archive any confirmed payments or payouts. Save any unsaved changes above first.`))return;archiveCurrent('Member list / order changed');state.members=proposed;makeCycle();save();popup('New order started; old ledger preserved.');}
function archiveManual(){if(!confirm('End this cycle and start fresh with the SAME group and first payout date? Previous recorded activity is preserved in History.'))return;startFresh('Manually archived');save();popup('Cycle reset; recorded activity archived.');}
function exportJson(){download(`SUSU-backup-${today()}.json`,JSON.stringify({...state,exportedAt:now()},null,2),'application/json;charset=utf-8');popup('Full JSON backup downloaded.');}
function csvCell(value){let t=String(value??'');if(/^[=+@\-\t\r]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"'}
function csvRows(){const rows=[['timestamp','event','cycle_id','round','member','amount','currency','scheduled_payout_date']];const cycles=[...state.archives,{...settingsOf(state),id:state.cycle.id}];for(const e of state.events){const c=cycles.find(x=>x.id===e.cycleId);rows.push([e.at,e.type,e.cycleId,e.roundIndex+1,e.memberName,e.amountMinor/minorFactor(e.currency),e.currency,c?plusPeriods(c.startDate,e.roundIndex,c.frequency):''])}return '\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n')+'\r\n';}
function exportCsv(){download(`SUSU-ledger-${today()}.csv`,csvRows(),'text/csv;charset=utf-8');popup('CSV ledger downloaded.');}
function markdownFiles(){const moneyCur=x=>money(x,state.currency);const current=cycleIndex(),round= current<0?null:state.cycle.rounds[current],recipient=current<0?'Cycle completed':state.members[current].name;
 const intro='> **Offline snapshot** generated '+new Date().toLocaleString()+'. This Markdown is readable in Obsidian but is not the live ledger. To confirm payments or make changes, open `SUSU.html` in your browser.\n\n';const nav='[[01 Home]] · [[02 Rotation]] · [[03 History]] · [[04 Setup]]\n\n';
 const homeMD='# Home · SUSU\n\n'+nav+intro+'## Current collector\n\n**'+recipient+'**\n\n**Full pot:** '+moneyCur(state.contributionMinor*state.members.length)+'\n\n'+(current<0?'The cycle is complete.\n':`**Round:** ${current+1} of ${state.members.length}\n\n**Scheduled payout:** ${formatDue(current)}\n\n**Received:** ${moneyCur(state.members.filter(m=>round.payments[m.id]).length*state.contributionMinor)}\n\n## Contribution checklist (snapshot only)\n\n`+state.members.map(m=>`- [${round.payments[m.id]?'x':' '}] ${m.name} — ${moneyCur(state.contributionMinor)}`).join('\n')+'\n')+'\n';
 const rotationMD='# Rotation · SUSU\n\n'+nav+intro+`**Frequency:** ${state.frequency}\n\n| # | Recipient | Scheduled payout | Pot | Status |\n|---:|---|---|---:|---|\n`+state.members.map((m,i)=>`| ${i+1} | ${m.name.replaceAll('|','\\|')} | ${formatDue(i)} | ${moneyCur(state.members.length*state.contributionMinor)} | ${state.cycle.rounds[i].payout?'Paid out':i===current?'Current':'Upcoming'} |`).join('\n')+'\n';
 const historyMD='# History · SUSU\n\n'+nav+intro+`**Archived cycles:** ${state.archives.length}\n\n| Date | Action | Member | Round | Amount |\n|---|---|---|---:|---:|\n`+state.events.slice().reverse().map(e=>`| ${stamp(e.at)} | ${e.type} | ${e.memberName.replaceAll('|','\\|')} | ${e.roundIndex+1} | ${money(e.amountMinor,e.currency)} |`).join('\n')+'\n';
 const setupMD='# Setup · SUSU\n\n'+nav+intro+`**Currency:** ${state.currency}\n\n**Amount per person:** ${moneyCur(state.contributionMinor)}\n\n**Frequency:** ${state.frequency}\n\n**First payout:** ${formatDay(state.startDate)}\n\n## Members in payout order\n\n`+state.members.map((m,i)=>`${i+1}. ${m.name}`).join('\n')+'\n\nUse **Setup** in `SUSU.html` to modify these values.\n';
 return {'01 Home.md':homeMD,'02 Rotation.md':rotationMD,'03 History.md':historyMD,'04 Setup.md':setupMD};}
function exportMarkdown(){const files=markdownFiles();const content=['# SUSU — Obsidian snapshot',`Generated ${new Date().toLocaleString()}. These notes are static; open SUSU.html in your browser to update the live tracker.`,'',...Object.entries(files).flatMap(([filename,body])=>['---',`<!-- ${filename} -->`,body])].join('\n');download(`SUSU-Obsidian-Snapshot-${today()}.md`,content,'text/markdown;charset=utf-8');popup('Markdown snapshot downloaded.');}
function download(filename,data,type){const blob=new Blob([data],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1400);}
async function restore(file){if(!file)return;if(file.size>8*1024*1024)return popup('Backup is larger than 8 MB.');try{const parsed=JSON.parse(await file.text());if(!validState(parsed))return popup('This is not a valid SUSU V1 backup.');if(!confirm(`Replace this browser's current SUSU data with the backup (${parsed.members.length} members, ${parsed.currency})? Export the existing ledger first if needed.`))return;state=parsed;save();tab='home';render();popup('JSON backup restored successfully.');}catch(e){popup('Unable to read backup JSON.');}finally{el('backup-file').value='';}}
function handleClick(e){const t=e.target.closest('[data-tab],[data-action]');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo({top:0,behavior:'auto'});return;}switch(t.dataset.action){case 'pay':onPayment(t.dataset.id);break;case 'payout':onPayout();break;case 'new-cycle':nextCycle();break;case 'up':case 'down':case 'add':case 'remove':changeMembers(t.dataset.action,t.dataset.id);break;case 'json-export':exportJson();break;case 'csv-export':exportCsv();break;case 'md-export':exportMarkdown();break;case 'json-import':el('backup-file').click();break;case 'manual-archive':archiveManual();break;}}
function init(){state=read();document.addEventListener('click',handleClick);document.addEventListener('submit',e=>{if(e.target.id==='settings-form')saveConfig(e)});document.addEventListener('change',e=>{if(e.target.id==='history-filter'){historyView=e.target.value;render()}});el('backup-file').addEventListener('change',e=>restore(e.target.files[0]));el('theme-btn').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';save()});render();}
init();
})();
</script>
</body>
